# Provoz Pronájmů (P15, P16, ZM-010) – stejný soubor pro autora i dalšího uživatele.
# Nastavení je v .env (vygeneruje: docker run --rm ghcr.io/jemop/pronajmy:<verze> init-env --url …).
#   docker compose up -d                       # lokální síť, http://<IP>:${PRONAJMY_PORT}
#   docker compose --profile tailscale up -d   # navíc přístup přes Tailscale (HTTPS)
# Jiný soubor s nastavením: --env-file <soubor> a v něm PRONAJMY_ENV_FILE=<soubor>.
name: pronajmy-prod

services:
  db:
    image: postgres:16-alpine
    env_file: ${PRONAJMY_ENV_FILE:-.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: ghcr.io/jemop/pronajmy:${PRONAJMY_VERSION:?Doplň PRONAJMY_VERSION do .env}
    env_file: ${PRONAJMY_ENV_FILE:-.env}
    environment:
      TZ: Europe/Prague
    ports:
      # PRONAJMY_BIND=127.0.0.1 = port jen pro tento počítač (přístup přes Tailscale).
      - "${PRONAJMY_BIND:-0.0.0.0}:${PRONAJMY_PORT:-8080}:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: ghcr.io/jemop/pronajmy-backup:${PRONAJMY_VERSION:?Doplň PRONAJMY_VERSION do .env}
    env_file: ${PRONAJMY_ENV_FILE:-.env}
    environment:
      TZ: Europe/Prague
    volumes:
      - ./backups:/backups
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:v1.104.1
    profiles: ["tailscale"]
    hostname: ${TS_HOSTNAME:-pronajmy}
    env_file: ${PRONAJMY_ENV_FILE:-.env}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      # LXC nemá /dev/net/tun – tailscaled běží v uživatelském režimu.
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    configs:
      - source: tailscale_serve
        target: /config/serve.json
    volumes:
      - ts_state:/var/lib/tailscale
    depends_on:
      - web
    restart: unless-stopped

configs:
  tailscale_serve:
    # HTTPS s certifikátem Tailscale, vše na web:8000 (TS_CERT_DOMAIN doplní Tailscale).
    content: |
      {"TCP": {"443": {"HTTPS": true}},
       "Web": {"$${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "http://web:8000"}}}}}

volumes:
  db_data:
  media_data:
  ts_state:
