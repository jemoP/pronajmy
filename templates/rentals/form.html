{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card">
  <h1 class="mb-3 text-lg font-bold">{{ title }}</h1>
  {% if form.errors %}<p class="notice-error mb-3">Nebylo uloženo – oprav zvýrazněná pole.</p>{% endif %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "rentals/includes/form_fields.html" %}
    <div class="flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary">{{ submit }}</button>
      <a href="{{ back }}" class="btn btn-secondary">Zpět</a>
    </div>
  </form>
</section>
{% endblock %}
