{# Stav salda: vždy ikona + text, nikdy jen barva. #}
{% if balance.overdue %}<span aria-hidden="true" style="color: var(--status-over)">✕</span> <span class="expense">{{ balance.overdue|czk }}</span> <span class="text-xs muted">po splatnosti</span>{% elif balance.balance > 0 %}{{ balance.balance|czk }} <span class="text-xs muted">před splatností</span>{% elif balance.balance < 0 %}<span class="income">{{ balance.balance|czk }}</span> <span class="text-xs muted">přeplatek</span>{% else %}<span aria-hidden="true" style="color: var(--status-ok)">✓</span> <span class="text-sm muted">vyrovnáno</span>{% endif %}
