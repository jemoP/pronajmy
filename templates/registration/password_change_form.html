{% extends "base.html" %}
{% block title %}Změna hesla{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card">
  <h1 class="mb-4 text-xl font-bold">Změna hesla</h1>
  <form method="post" action="{% url 'password_change' %}" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <label class="field">{{ field.label }}
      <input class="input" type="password" name="{{ field.html_name }}" autocomplete="{% if field.name == 'old_password' %}current-password{% else %}new-password{% endif %}" required{% if field.errors %} aria-invalid="true"{% endif %}>
      {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
    </label>
    {% endfor %}
    <p class="text-sm muted">Heslo musí mít aspoň 8 znaků, nesmí být jen z číslic ani běžně používané.</p>
    <div class="flex flex-wrap gap-2">
      <button type="submit" class="btn btn-primary">Změnit heslo</button>
      <a href="{% url 'core:home' %}" class="btn btn-secondary">Zpět</a>
    </div>
  </form>
</div>
{% endblock %}
