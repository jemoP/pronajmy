# Build a zveřejnění provozního image v GHCR (ZM-010): po tagu vX.Y.Z nebo ručně.
# Image je privátní balíček; přístup ke čtení se přiděluje v nastavení balíčku.
name: image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jemop/pronajmy

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pronajmy
          POSTGRES_USER: pronajmy
          POSTGRES_PASSWORD: pronajmy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pronajmy" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://pronajmy:pronajmy@localhost:5432/pronajmy
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps config
      - run: uv run pytest

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Kontrola obsahu (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          load: true
          tags: pronajmy:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/check-image.sh pronajmy:check
      - name: Build a zveřejnění (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
