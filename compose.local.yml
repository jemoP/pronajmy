# Jen pro vývojáře: místo stažení z GHCR postaví provozní image z místního kódu (ZM-010).
#   docker compose -f compose.demo.yml -f compose.local.yml up -d --build
services:
  web:
    image: pronajmy:local
    build:
      context: .
      target: prod
      args:
        APP_VERSION: místní
  reset:
    image: pronajmy:local
