name: pronajmy

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    # Vývoj: Tailwind sleduje šablony, runserver načítá změny v Pythonu.
    command: >
      sh -c "tailwindcss -i assets/css/input.css -o static/css/app.css --watch=always &
             exec uv run python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      TZ: Europe/Prague
    ports:
      # Port 8000 v LXC drží Pokuty, 8001 HomeFinance – Pronájmy na 8002.
      - "8002:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
